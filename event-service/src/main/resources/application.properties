spring.application.name=studentevents

# --- Datasource (PostgreSQL) — credentials supplied via environment (.env) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# validate (not update): the schema is owned by Flyway migrations (#90);
# Hibernate must never silently alter tables.
spring.jpa.hibernate.ddl-auto=validate