# Active only under the `inmemory` profile (database-free runs, e.g. the bridge
# responder's YSE_BRIDGE_INMEMORY test mode). With no DB_URL, the JPA stack's
# auto-configuration would fail at startup, so switch off the three DB-rooted
# auto-configs: the DataSource, the Hibernate EntityManagerFactory built on it,
# and the Flyway migration run against it.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration