name: Build

# Runs on every pull request, so all code is built, tested, and linted before merge.
on:
  pull_request:

# Cancel an in-progress run when the same ref is pushed again, to avoid piling
# up redundant builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: api-core/requirements.txt
      # The bridge integration tests spawn the Python responder as a subprocess,
      # and its import graph now pulls in SQLAlchemy (via the SQLAlchemy*
      # repositories re-exported from each slice). Install api-core's runtime
      # deps so the spawned `python` can start.
      - name: Install api-core Python dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -r api-core/requirements.txt
      # `verify` compiles, runs the JUnit suite, and runs Checkstyle in one pass.
      - name: Build, test and lint
        run: ./mvnw -B verify
